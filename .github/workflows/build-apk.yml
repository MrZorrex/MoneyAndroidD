name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "arena/c439649e-moneyandroidd" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK platforms
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find $ANDROID_HOME -name sdkmanager -type f | head -1)"
          fi
          yes | $SDKMANAGER --licenses >/dev/null 2>&1 || true
          $SDKMANAGER "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Commit APK to repository
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/release/*.apk apk/
          ls -lh apk/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apk/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "build: add release APK [skip ci]"
            git push origin HEAD:arena/c439649e-moneyandroidd
          fi
