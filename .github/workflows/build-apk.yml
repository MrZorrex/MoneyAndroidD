name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "arena/c439649e-moneyandroidd" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (preinstalled)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" 2>/dev/null || true
          ls "$ANDROID_HOME/cmdline-tools" 2>/dev/null || true

      - name: Install SDK platforms
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find $ANDROID_HOME -name sdkmanager -type f | head -1)"
          fi
          echo "sdkmanager=$SDKMANAGER"
          yes | $SDKMANAGER --licenses >/dev/null 2>&1 || true
          $SDKMANAGER "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: paysplit-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
