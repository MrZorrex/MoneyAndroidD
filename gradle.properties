# Настройки Gradle для всего проекта.
# Файл читается Gradle до выполнения скриптов сборки.

# --- JVM для Gradle-демона ---
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# --- Kotlin ---
kotlin.code.style=official

# --- AndroidX ---
android.useAndroidX=true

# --- AGP 9: режим совместимости ---
# AGP 9 по умолчанию использует «встроенный Kotlin» (built-in Kotlin) и новый DSL.
# Мы явно отключаем встроенный Kotlin, чтобы применить классический плагин
# org.jetbrains.kotlin.android — это самый проверенный путь для проектов
# с Room + KSP + Compose Compiler Gradle Plugin.
# Когда захочется перейти на «новый» способ, удалите эти две строки
# и плагин kotlin-android из app/build.gradle.kts (см. README).
android.builtInKotlin=false
android.newDsl=false
